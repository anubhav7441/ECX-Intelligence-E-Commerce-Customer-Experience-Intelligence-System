# Quality gates on every push and pull request: lint, security scan, tests with coverage, and a Docker build.
# The large data files are not in the repository, so tests that need them are skipped automatically (see tests/conftest.py).
name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - run: ruff check .
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install bandit pip-audit
      - name: Static security scan (medium and high findings fail the build)
        run: bandit -q -r app ecx2 ecx3 multids recsys -ll
      - name: Known-vulnerability scan of pinned dependencies
        run: pip-audit -r requirements.txt
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest-cov
      - name: Test with coverage
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage-xml, path: coverage.xml }
  docker:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ecx-intelligence:ci .
